<script type="module">
import * as THREE from 'three';

/* =====================================================================
   CONFIG — constantes fáciles de tocar
   ===================================================================== */
const CONFIG = {
  // --- Jugador ---
  WALK_SPEED: 1.45,        // m/s caminando
  RUN_SPEED: 2.9,          // m/s corriendo (Shift)
  CROUCH_SPEED: 0.75,      // m/s agachado (C)
  STAIR_SPEED: 0.62,       // multiplicador de velocidad en escaleras
  EYE_HEIGHT: 1.6,         // altura de los ojos de pie
  CROUCH_EYE: 1.0,         // altura de los ojos agachado
  PLAYER_RADIUS: 0.28,
  MOUSE_SENS: 0.0022,      // radianes por píxel (se multiplica por la sensibilidad del menú)
  HEADBOB: 0.026,          // amplitud vertical del balanceo de cámara
  STEP_WALK: 0.74,         // metros por paso caminando
  STEP_RUN: 1.05,          // metros por paso corriendo
  STEP_CROUCH: 0.55,
  INTERACT_DIST: 2.2,      // alcance de la tecla E
  // --- Visual ---
  FOV: 70,
  FOG_MULT: 1.0,           // multiplicador global de la niebla
  GRAIN: 0.07,             // grano de película
  VIGNETTE: 0.9,           // viñeteado
  CHROMATIC: 0.0022,       // aberración cromática
  EXPOSURE: 1.45,          // exposición base (el brillo del menú la multiplica)
  FADE_TIME: 0.75,         // segundos del fundido a negro entre zonas
  FLICKER_MIN: 16,         // segundos mínimos entre parpadeos de luces
  FLICKER_MAX: 50,
  FLASH_INTENSITY: 9,      // linterna (candelas)
  FLASH_RANGE: 16,
  FLASH_LAG: 9,            // cuanto más alto, menos retraso al seguir la cámara
  // --- Audio ---
  MASTER: 0.9,
  HUM_VOLUME: 1.0,         // zumbido de fluorescentes
  FOOTSTEP_VOLUME: 0.75,
  AMBIENT_MULT: 1.0,       // resto de ambientes
  REVERB_MULT: 1.0,
};

const DEBUG = /[?&]debug/.test(location.search);

/* =====================================================================
   Utilidades
   ===================================================================== */
const PI = Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const yawTo = (dx, dz) => Math.atan2(-dx, -dz);
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Color hex (sRGB) -> array lineal
const lin = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const scale3 = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

/* =====================================================================
   Ajustes (localStorage) y niveles de calidad
   ===================================================================== */
const SETTINGS_KEY = 'shuden-go-settings-v1';
const S = {
  master: 0.8, ambient: 0.85, musicOn: false, music: 0.5,
  quality: 'medium', brightness: 1.0,
  sensitivity: 1.0, invertY: false, headBob: true,
};
function loadSettings() {
  try { const d = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); for (const k in S) if (k in d && typeof d[k] === typeof S[k]) S[k] = d[k]; } catch (e) { /* sin localStorage */ }
  if (!QUALITY[S.quality]) S.quality = 'medium';
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) { /* ignorar */ } }

// Calidad: resolución interna, MSAA, luces reales, post-procesado, distancia de dibujo, audio
const QUALITY = {
  low:    { scale: 0.6,  samples: 0, realLights: 1, ca: false, hrtf: false, far: 45,  fog: 1.2,  irMax: 2.2 },
  medium: { scale: 0.8,  samples: 0, realLights: 2, ca: true,  hrtf: true,  far: 70,  fog: 1.0,  irMax: 3.5 },
  high:   { scale: 1.0,  samples: 4, realLights: 3, ca: true,  hrtf: true,  far: 100, fog: 0.9,  irMax: 5.0 },
};
let Q = QUALITY.medium;

/* =====================================================================
   TEXTURAS PROCEDURALES (canvas) — cero assets externos
   ===================================================================== */
const JP = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","YuGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","Source Han Sans JP","IPAGothic","IPAPGothic","MS PGothic",sans-serif';
const EN = '"Helvetica Neue",Arial,"Segoe UI",sans-serif';
let MAX_ANISO = 4;
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
// Lienzos en CPU (willReadFrequently): leemos sus píxeles, así se evita esperar a la GPU
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d', { willReadFrequently: true }); return c; }

// Ruido de valor periódico (para que las texturas se repitan sin costuras)
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, px, py, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0, s), b = hash2(x1, y0, s), c = hash2(x0, y1, s), d = hash2(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// fbm: x,y en [0,px) x [0,py)
function fbm(x, y, px, py, oct, s) {
  let sum = 0, amp = 0.5, norm = 0;
  for (let o = 0; o < oct; o++) { sum += vnoise(x, y, px, py, s + o * 17) * amp; norm += amp; x *= 2; y *= 2; px *= 2; py *= 2; amp *= 0.5; }
  return sum / norm;
}
// Rellena un canvas píxel a píxel
function pixels(w, h, fn) {
  const cv = mkCanvas(w, h), g = cv.getContext('2d');
  const im = g.createImageData(w, h), d = im.data, o = [0, 0, 0];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    fn(x, y, o); const i = (y * w + x) * 4;
    d[i] = o[0]; d[i + 1] = o[1]; d[i + 2] = o[2]; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0); return cv;
}
// Suciedad multiplicativa
function grime(cv, amount, seed, sc = 3) {
  if (amount <= 0) return cv;
  const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = fbm(x / w * sc, y / h * sc, sc, sc, 4, seed);
    const k = 1 - amount * Math.max(0, n - 0.38) * 1.8 - (hash2(x, y, seed) - 0.5) * 0.035;
    const i = (y * w + x) * 4; d[i] *= k; d[i + 1] *= k; d[i + 2] *= k;
  }
  g.putImageData(im, 0, 0); return cv;
}
function toTex(cv, { srgb = true, repeat = true } = {}) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}

// Caché de texturas compartidas entre zonas (no se liberan al cambiar de zona)
const TEX = {};
const TEXT = {};
const tex = (key, make) => { if (TEX[key]) return TEX[key]; const t0 = performance.now(); TEX[key] = make(); if (DEBUG) TEXT[key] = Math.round(performance.now() - t0); return TEX[key]; };

// Mosaico de azulejos (paredes)
function tileCanvas({ size = 512, n = 10, grout = 0.07, base, vary = 8, groutCol, accentP = 0, accents = [], dirt = 0.25, seed = 1 }) {
  const R = mulberry32(seed);
  const cv = mkCanvas(size, size), g = cv.getContext('2d');
  g.fillStyle = rgb(groutCol); g.fillRect(0, 0, size, size);
  const ts = size / n, gw = Math.max(1.5, ts * grout), bev = Math.max(1, ts * 0.06);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    let c = base; if (R() < accentP) c = accents[Math.floor(R() * accents.length)];
    const v = (R() - 0.5) * vary, x = i * ts + gw / 2, y = j * ts + gw / 2, w = ts - gw;
    g.fillStyle = rgb([c[0] + v, c[1] + v, c[2] + v]); g.fillRect(x, y, w, w);
    g.fillStyle = 'rgba(255,255,255,0.13)'; g.fillRect(x, y, w, bev);
    g.fillStyle = 'rgba(0,0,0,0.10)'; g.fillRect(x, y + w - bev, w, bev);
  }
  return grime(cv, dirt, seed + 3);
}
function tileBump(n, grout, size = 256) {
  const cv = mkCanvas(size, size), g = cv.getContext('2d');
  g.fillStyle = '#1a1a1a'; g.fillRect(0, 0, size, size);
  const ts = size / n, gw = Math.max(1.2, ts * grout);
  g.fillStyle = '#e8e8e8';
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) g.fillRect(i * ts + gw / 2, j * ts + gw / 2, ts - gw, ts - gw);
  return cv;
}
// Baldosas de piedra moteada (granito / terrazo)
function stoneCanvas({ size = 512, nx = 4, ny = 4, base = [140, 140, 138], vary = 8, speck = 0.1, groutCol = [70, 70, 70], grout = 2, seed = 3, cloud = 0.3, alt = null }) {
  const tw = size / nx, th = size / ny;
  return pixels(size, size, (x, y, o) => {
    const i = Math.floor(x / tw), j = Math.floor(y / th);
    if (x % tw < grout || y % th < grout) { o[0] = groutCol[0]; o[1] = groutCol[1]; o[2] = groutCol[2]; return; }
    const c = (alt && alt(i, j)) || base;
    const tv = (hash2(i, j, seed) - 0.5) * vary;
    const n = (fbm(x / size * 4, y / size * 4, 4, 4, 3, seed) - 0.5) * cloud * 60;
    const h = hash2(x, y, seed + 7);
    const sp = h < speck ? -45 * (1 - h / speck) : h > 1 - speck * 0.4 ? 28 : 0;
    const v = tv + n + sp;
    o[0] = c[0] + v; o[1] = c[1] + v; o[2] = c[2] + v;
  });
}

const Tex = {
  tileWhite: () => tex('tileWhite', () => toTex(tileCanvas({ n: 10, base: [228, 230, 226], groutCol: [150, 152, 148], accentP: 0.035,
    accents: [[176, 160, 128], [150, 132, 104], [196, 186, 160]], dirt: 0.22, seed: 11 }))),
  tileWhiteBump: () => tex('tileWhiteBump', () => toTex(tileBump(10, 0.07), { srgb: false })),
  tileBlue: () => tex('tileBlue', () => toTex(tileCanvas({ n: 12, base: [218, 224, 228], groutCol: [128, 136, 142], vary: 10, dirt: 0.2, seed: 21 }))),
  tileBlueBump: () => tex('tileBlueBump', () => toTex(tileBump(12, 0.08), { srgb: false })),
  paver: () => tex('paver', () => toTex(stoneCanvas({ nx: 4, ny: 4, base: [120, 121, 122], vary: 14, speck: 0.12, groutCol: [58, 58, 60], grout: 3, seed: 5 }))),
  floorTile: () => tex('floorTile', () => toTex(stoneCanvas({ nx: 4, ny: 4, base: [168, 168, 166], vary: 8, speck: 0.08, groutCol: [96, 96, 94], grout: 2, seed: 9, cloud: 0.2 }))),
  asphalt: () => tex('asphalt', () => toTex(pixels(512, 512, (x, y, o) => {
    const n = fbm(x / 512 * 6, y / 512 * 6, 6, 6, 4, 11), h = hash2(x, y, 5);
    let v = 30 + n * 22; if (h > 0.985) v += 34 * (h - 0.985) / 0.015; else if (h < 0.025) v -= 10;
    v *= 0.78 + 0.34 * fbm(x / 512 * 2, y / 512 * 2, 2, 2, 3, 21);
    o[0] = v; o[1] = v; o[2] = v * 1.05;
  }))),
  concrete: () => tex('concrete', () => {
    const cv = pixels(512, 512, (x, y, o) => {
      const n = fbm(x / 512 * 4, y / 512 * 4, 4, 4, 5, 31), f = hash2(x, y, 9);
      const v = 116 + (n - 0.5) * 70 + (f - 0.5) * 14; o[0] = v * 1.02; o[1] = v; o[2] = v * 0.94;
    });
    const g = cv.getContext('2d'), R = mulberry32(77);
    for (let k = 0; k < 16; k++) {
      const x = R() * 512, w = 3 + R() * 10, y = R() * 200, l = 120 + R() * 320;
      const gr = g.createLinearGradient(0, y, 0, y + l); gr.addColorStop(0, 'rgba(30,26,20,0.16)'); gr.addColorStop(1, 'rgba(30,26,20,0)');
      g.fillStyle = gr; g.fillRect(x, y, w, l);
    }
    g.fillStyle = 'rgba(30,30,30,0.5)';
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { g.beginPath(); g.arc(64 + i * 128, 64 + j * 128, 4, 0, PI * 2); g.fill(); }
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, 0, 512, 2); g.fillRect(0, 0, 2, 512);
    return toTex(cv);
  }),
  ceilRough: () => tex('ceilRough', () => toTex(pixels(512, 512, (x, y, o) => {
    const n = fbm(x / 512 * 48, y / 512 * 48, 48, 48, 2, 41), m = fbm(x / 512 * 6, y / 512 * 6, 6, 6, 2, 43), h = hash2(x, y, 12);

  thump(t, f, v) {

    const bp = this.filt('bandpass', f, 3), g = this.gain(0); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.001); g.gain.exponentialRampToValueAtTime(0.0002, t + 0.012);

    const bp = this.filt('bandpass', 1300, 0.5), g = this.gain(0); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0003, t + 0.38);

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0002, t + 0.06);

    const o = this.ctx.createOscillator(), g = this.gain(0); o.frequency.setValueAtTime(75, t0); o.frequency.exponentialRampToValueAtTime(48, t0 + 0.2);

  shutterRattle(pos) {
    if (!this.ready) return; const d = this.at(pos, 0.9, 1.5), t0 = this.ctx.currentTime + 0.01; let t = t0;
    for (let i = 0; i < 18; i++) { this.metalHit(d, t, 0.22 * Math.exp(-i / 8) * rand(0.6, 1), rand(250, 340)); t += rand(0.02, 0.06); }
    const o = this.ctx.createOscillator(), g = this.gain(0); o.frequency.setValueAtTime(88, t0); o.frequency.exponentialRampToValueAtTime(70, t0 + 0.8);

    if (!this.ready) return; const d = this.at(pos, 0.5), t = this.ctx.currentTime + 0.01;

  },
  drip(dest, t) {
    const o = this.ctx.createOscillator(), g = this.gain(0), f0 = rand(650, 1500);
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * rand(1.7, 2.5), t + 0.045);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(rand(0.35, 0.7), t + 0.003); g.gain.exponentialRampToValueAtTime(0.0003, t + rand(0.05, 0.09));
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.12);
    const s = this.ctx.createBufferSource(); s.buffer = this.white; const hp = this.filt('highpass', 3500), g2 = this.gain(0);
    this.env(g2, t, 0.12, 0.001, 0.006); s.connect(hp); hp.connect(g2); g2.connect(dest); s.start(t, Math.random(), 0.02);
  },
  carPass(dest) {
    const c = this.ctx, t = c.currentTime + 0.05, dur = rand(5, 9), dir = Math.random() < 0.5 ? -1 : 1;
    const s = this.loop('pink'), bp = this.filt('bandpass', 250, 0.9), lp = this.filt('lowpass', 1800), g = this.gain(0);
    bp.frequency.setValueAtTime(220, t); bp.frequency.linearRampToValueAtTime(rand(600, 1000), t + dur * 0.5); bp.frequency.linearRampToValueAtTime(200, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(rand(0.4, 0.8), t + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const eng = c.createOscillator(), elp = this.filt('lowpass', 220), eg = this.gain(0.25); eng.type = 'sawtooth';
    const ef = rand(42, 70); eng.frequency.setValueAtTime(ef * 1.04, t); eng.frequency.linearRampToValueAtTime(ef * 0.95, t + dur);
    let out = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.setValueAtTime(-0.85 * dir, t); p.pan.linearRampToValueAtTime(0.85 * dir, t + dur); g.connect(p); out = p; }
    s.connect(bp); bp.connect(lp); lp.connect(g); eng.connect(elp); elp.connect(eg); eg.connect(g); out.connect(dest);
    eng.start(t); s.stop(t + dur + 0.1); eng.stop(t + dur + 0.1);
  },
  distantTrain(dest) {
    const c = this.ctx, t = c.currentTime + 0.05, dur = rand(9, 14), pk = t + dur * rand(0.35, 0.55);
    const s = this.loop('brown'), lp = this.filt('lowpass', 140), g = this.gain(0);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, pk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(lp); lp.connect(g);
    const o1 = c.createOscillator(), o2 = c.createOscillator(), og = this.gain(0.35); o1.frequency.value = rand(29, 34); o2.frequency.value = rand(44, 49);
    o1.connect(og); o2.connect(og); og.connect(g);
    const sq = this.loop('white'), bp = this.filt('bandpass', rand(2300, 2900), 7), sg = this.gain(0);
    sg.gain.setValueAtTime(0, t); sg.gain.linearRampToValueAtTime(0, pk - 1.5); sg.gain.linearRampToValueAtTime(0.012, pk); sg.gain.linearRampToValueAtTime(0, pk + 2);
    sq.connect(bp); bp.connect(sg);
    let out = this.gain(1); g.connect(out); sg.connect(out);
    if (c.createStereoPanner) { const p = c.createStereoPanner(); const d = Math.random() < 0.5 ? -1 : 1; p.pan.setValueAtTime(-0.6 * d, t); p.pan.linearRampToValueAtTime(0.6 * d, t + dur); out.connect(p); out = p; }
    out.connect(dest);
    // golpeteo de juntas de vía, muy lejano
    for (let k = 0; k < 10; k++) { const tt = pk - 1.6 + k * 0.32 + (k % 2) * 0.12; this.thumpTo(out, tt, 60, 0.12); }
    for (const n of [o1, o2]) { n.start(t); n.stop(t + dur + 0.1); } s.stop(t + dur + 0.1); sq.stop(t + dur + 0.1);
  },
  thumpTo(dest, t, f, v) {
    const o = this.ctx.createOscillator(), g = this.gain(0); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.08);
    this.env(g, t, v, 0.004, 0.12); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.2);
  },
};

// Constructores de emisores (ambientes)
const EMIT = {
  // Zumbido de fluorescente: armónicos de 120 Hz (red de 60 Hz) + chisporroteo + leve modulación
  hum(A, em, def) {
    const c = A.ctx, f = (def.freq || 120) * rand(0.997, 1.003), mix = A.gain(1); mix.connect(em.out);
    (def.harm || [1, 0.45, 0.22, 0.1, 0.05]).forEach((a, i) => { const o = c.createOscillator(); o.frequency.value = f * (i + 1) * (i ? rand(0.999, 1.001) : 1); const g = A.gain(a * 0.5); o.connect(g); g.connect(mix); o.start(); em.nodes.push(o); });
    const sq = c.createOscillator(); sq.type = 'square'; sq.frequency.value = f;
    const bp = A.filt('bandpass', def.sizzleF || 3200, 1.2), sg = A.gain(0.03 * (def.sizzle ?? 1));
    sq.connect(bp); bp.connect(sg); sg.connect(mix); sq.start(); em.nodes.push(sq);
    const lfo = c.createOscillator(), lg = A.gain(0.16); lfo.frequency.value = rand(0.07, 0.3); lfo.connect(lg); lg.connect(mix.gain); lfo.start(); em.nodes.push(lfo);
  },
  // Rótulo luminoso: más chisporroteo que zumbido
  sign(A, em, def) { EMIT.hum(A, em, { ...def, harm: [0.4, 0.3, 0.2, 0.12, 0.08, 0.05], sizzle: 2.4, sizzleF: 4200 }); },
  // Farola de sodio: zumbido grave + crepitar ocasional
  lamp(A, em, def) {
    EMIT.hum(A, em, { ...def, harm: [0.5, 0.35, 0.2, 0.12], sizzle: 1.6, sizzleF: 2600 });
    let t = rand(2, 6); em.update = (dt) => { t -= dt; if (t <= 0) { t = rand(1.5, 8); for (let i = 0; i < randi(1, 4); i++) setTimeout(() => !em.dead && A.click(em.out, rand(0.1, 0.3), rand(2500, 6000)), i * rand(20, 70)); } };
  },
  // Viento canalizado por la escalera
  wind(A, em, def) {
    const s = A.loop('pink'), bp = A.filt('bandpass', 420, 0.7), lp = A.filt('lowpass', 1500), g = A.gain(0.6);
    s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(em.out);
    const s2 = A.loop('brown'), lp2 = A.filt('lowpass', 170), g2 = A.gain(0.55); s2.connect(lp2); lp2.connect(g2); g2.connect(em.out);
    em.nodes.push(s, s2);
    let t = 0; em.update = (dt) => {
      t -= dt; if (t > 0) return; t = rand(0.8, 2.6);
      const now = A.ctx.currentTime, gust = Math.pow(Math.random(), 1.5);
      bp.frequency.setTargetAtTime(rand(260, 520) * (0.75 + gust * 0.8), now, 0.9); g.gain.setTargetAtTime(0.22 + gust * 0.85, now, 1.0); g2.gain.setTargetAtTime(0.4 + gust * 0.4, now, 1.2);
    };
  },
  // Ventilación lejana: ruido grave + motor
  vent(A, em, def) {
    const s = A.loop('brown'), lp = A.filt('lowpass', 260), g = A.gain(0.9); s.connect(lp); lp.connect(g); g.connect(em.out);
    const h = A.loop('pink'), bp = A.filt('bandpass', 1100, 0.5), hg = A.gain(0.05); h.connect(bp); bp.connect(hg); hg.connect(em.out);
    const o = A.ctx.createOscillator(), og = A.gain(0.12); o.frequency.value = rand(46, 50); o.connect(og); og.connect(em.out);
    const o2 = A.ctx.createOscillator(), og2 = A.gain(0.05); o2.frequency.value = o.frequency.value * 2.01; o2.connect(og2); og2.connect(em.out);
    o.start(); o2.start(); em.nodes.push(s, h, o, o2);
  },
  // Goteo con eco
  drip(A, em, def) {
    let t = rand(1, 4); em.update = (dt) => {
      t -= dt; if (t > 0) return; t = rand(def.min || 2.5, def.max || 9);
      const now = A.ctx.currentTime; A.drip(em.out, now + 0.01); if (Math.random() < 0.35) A.drip(em.out, now + rand(0.35, 0.9));
    };
  },
  // Ciudad lejana: lecho grave de tráfico + coches que pasan a lo lejos
  city(A, em, def) {
    const s = A.loop('brown'), lp = A.filt('lowpass', 300), g = A.gain(0.8); s.connect(lp); lp.connect(g); g.connect(em.out);
    const h = A.loop('pink'), bp = A.filt('bandpass', 700, 0.4), hg = A.gain(0.1); h.connect(bp); bp.connect(hg); hg.connect(em.out);
    em.nodes.push(s, h);
    let t = rand(3, 8), sw = 0; em.update = (dt) => {
      t -= dt; sw -= dt;
      if (sw <= 0) { sw = rand(3, 7); g.gain.setTargetAtTime(rand(0.5, 1.0), A.ctx.currentTime, 2.5); }
      if (t <= 0) { t = rand(7, 22); A.carPass(em.out); }
    };
  },
  // Máquina expendedora: compresor que arranca y para + balasto + relés
  vending(A, em, def) {
    const c = A.ctx, comp = A.gain(0); comp.connect(em.out);
    const o1 = c.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 59; const g1 = A.gain(0.35); o1.connect(g1); g1.connect(comp);
    const o2 = c.createOscillator(); o2.frequency.value = 118.5; const g2 = A.gain(0.15); o2.connect(g2); g2.connect(comp);
    const s = A.loop('brown'), lp = A.filt('lowpass', 420), g3 = A.gain(0.35); s.connect(lp); lp.connect(g3); g3.connect(comp);
    const o3 = c.createOscillator(); o3.frequency.value = 120; const g4 = A.gain(0.07); o3.connect(g4); g4.connect(em.out);
    const sq = c.createOscillator(); sq.type = 'square'; sq.frequency.value = 120; const bp = A.filt('bandpass', 2600, 1.5), g5 = A.gain(0.015); sq.connect(bp); bp.connect(g5); g5.connect(em.out);
    [o1, o2, o3, sq].forEach((o) => o.start()); em.nodes.push(o1, o2, o3, sq, s);
    let on = Math.random() < 0.6, t = rand(5, 25), ck = rand(4, 12);
    comp.gain.value = on ? 1 : 0;
    em.update = (dt) => {
      t -= dt; ck -= dt;
      if (t <= 0) { on = !on; t = on ? rand(30, 60) : rand(12, 30); const now = c.currentTime; comp.gain.setTargetAtTime(on ? 1 : 0, now, on ? 0.5 : 0.25); A.thumpTo(em.out, now + 0.01, 70, 0.4); A.click(em.out, 0.25, 2000); }
      if (ck <= 0) { ck = rand(5, 18); A.click(em.out, rand(0.08, 0.2), rand(1800, 3500)); }
    };
  },
  // Tren lejano en las profundidades (global)
  rumble(A, em, def) {
    let t = rand(def.first ?? 25, (def.first ?? 25) + 30); em.update = (dt) => { t -= dt; if (t <= 0) { t = rand(55, 120); A.distantTrain(em.out); } };
  },
};

/* =====================================================================
   POST-PROCESADO — un solo pase: aberración cromática, tono, viñeta, grano, fundido
   ===================================================================== */
const Post = {
  rt: null, scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), mat: null, w: 1, h: 1,
  init() {
    this.mat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: { value: 0 }, uGrain: { value: CONFIG.GRAIN },
        uVig: { value: CONFIG.VIGNETTE }, uCA: { value: CONFIG.CHROMATIC }, uExp: { value: CONFIG.EXPOSURE }, uFade: { value: 1 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uGrain, uVig, uCA, uExp, uFade; varying vec2 vUv;
        vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
        float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
        void main(){
          vec2 d = vUv - 0.5; float r2 = dot(d, d); vec3 c;
          if (uCA > 0.0) { vec2 o = d * uCA * (0.6 + r2 * 5.0);
            c = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b); }
          else c = texture2D(tDiffuse, vUv).rgb;
          c = aces(c * uExp);
          c = pow(c, vec3(1.0 / 2.2));
          // gradación: sombras ligeramente frías, contraste suave de cámara vieja
          c = mix(c, c * vec3(0.94, 1.0, 1.06), 0.5 * (1.0 - c));
          float v = smoothstep(0.95, 0.25, length(d * vec2(uRes.x / uRes.y, 1.0)) * 0.95);
          c *= mix(1.0, v, uVig);
          float g = hash(vUv * uRes + fract(uTime * 7.31) * 517.0) - 0.5;
          c += g * uGrain * (0.55 + 0.45 * (1.0 - dot(c, vec3(0.33))));
          c *= 1.0 - uFade;
          gl_FragColor = vec4(c, 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.mat); q.frustumCulled = false; this.scene.add(q);
  },
  resize() {
    const w = Math.max(2, Math.floor(innerWidth * Q.scale)), h = Math.max(2, Math.floor(innerHeight * Q.scale));
    if (this.rt) this.rt.dispose();
    const ext = World.renderer.extensions, canFloat = ext.has('EXT_color_buffer_float') || ext.has('EXT_color_buffer_half_float');
    this.rt = new THREE.WebGLRenderTarget(w, h, { type: canFloat ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: Q.samples, depthBuffer: true, stencilBuffer: false });

    GlowMat.uniforms.uScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV) / 2));
  },
  render(t, fade) {
    const u = this.mat.uniforms; u.uTime.value = t; u.uFade.value = fade; u.uExp.value = CONFIG.EXPOSURE * S.brightness; u.uCA.value = Q.ca ? CONFIG.CHROMATIC : 0;

  },

/* =====================================================================
   INPUT — teclado + ratón (Pointer Lock)
   ===================================================================== */
const Input = {
  keys: new Set(), locked: false, lockTime: 0,
  down(code) { return this.keys.has(code); },
  requestLock() {
    const el = World.renderer.domElement;
    try { const p = el.requestPointerLock(); if (p && p.catch) p.catch(() => onLockError()); } catch (e) { onLockError(); }
  },
};
function initInput() {
  addEventListener('keydown', (e) => {
    if (e.code === 'Tab') e.preventDefault();
    Input.keys.add(e.code);
    if (Game.state !== 'playing' || e.repeat) return;
    if (e.code === 'KeyF') Flashlight.toggle();
    if (e.code === 'KeyE') Game.interact();
    if (e.code === 'KeyC') Player.toggleCrouch();
    if (e.code === 'Escape') { Game.pause(); if (document.pointerLockElement) document.exitPointerLock(); }
  });
  addEventListener('keyup', (e) => Input.keys.delete(e.code));
  addEventListener('blur', () => Input.keys.clear());
  addEventListener('mousemove', (e) => {
    if (!Input.locked || Game.state !== 'playing') return;
    // Al bloquear el ratón algunos navegadores mandan un "salto" falso (recentrado del cursor): se ignora
    const m = Math.max(Math.abs(e.movementX), Math.abs(e.movementY));
    if ((performance.now() - Input.lockTime < 600 && m > 40) || m > 500) return;
    Player.look(clamp(e.movementX, -200, 200), clamp(e.movementY, -200, 200));
  });
  document.addEventListener('pointerlockchange', () => {
    Input.locked = document.pointerLockElement === World.renderer.domElement;
    if (Input.locked) Input.lockTime = performance.now();
    if (Input.locked) document.getElementById('resume').classList.add('hidden');
    else if (Game.state === 'playing') Game.pause();
  });
  document.addEventListener('pointerlockerror', onLockError);
  World.renderer.domElement.addEventListener('click', () => { if (Game.state === 'playing' && !Input.locked) Input.requestLock(); });
}
function onLockError() {
  if (DEBUG) return; // en pruebas automáticas se juega sin bloquear el ratón
  if (Game.state === 'playing') document.getElementById('resume').classList.remove('hidden');
}

/* =====================================================================
   JUGADOR — movimiento, colisiones AABB, escaleras, balanceo, pisadas
   ===================================================================== */
const Player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(), yaw: 0, pitch: 0,
  eye: CONFIG.EYE_HEIGHT, crouch: false, camY: 0, surface: 'tile', stair: null,
  stepAcc: 0, stepCount: 0, bobAmp: 0, lastY: 0, moving: false,
  place(sp, zone) {
    const g = zone.groundTop(sp.x, sp.z) || { y: 0 };
    this.pos.set(sp.x, g.y, sp.z); this.yaw = sp.yaw; this.pitch = sp.pitch || 0; this.vel.set(0, 0, 0);
    this.camY = g.y + this.eye; this.lastY = g.y; this.stepAcc = 0; this.bobAmp = 0;
  },
  look(dx, dy) {
    const k = CONFIG.MOUSE_SENS * S.sensitivity;
    this.yaw -= dx * k; this.pitch -= dy * k * (S.invertY ? -1 : 1);
    this.pitch = clamp(this.pitch, -1.45, 1.45);
  },
  toggleCrouch() { this.crouch = !this.crouch; AudioSys.rustle(this.crouch ? 0.12 : 0.09); },
  // ¿Cabe el jugador en (x,z)? Debe haber suelo bajo todo su contorno y ningún obstáculo
  canStand(zone, x, z, refY) {
    const r = CONFIG.PLAYER_RADIUS, k = r * 0.707;
    const pts = [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r], [k, k], [-k, k], [k, -k], [-k, -k]];
    let center = null;
    for (const [ox, oz] of pts) { const g = zone.groundAt(x + ox, z + oz, refY); if (!g) return null; if (!center) center = g; }
    const top = center.y + (this.crouch ? 1.15 : 1.75);
    for (const c of zone.colliders) {
      if (center.y > c.y1 - 0.3 || top < c.y0 || !condOk(c.cond)) continue;
      const nx = clamp(x, c.x0, c.x1), nz = clamp(z, c.z0, c.z1);
      if ((x - nx) ** 2 + (z - nz) ** 2 < r * r) return null;
    }
    return center;
  },
  update(dt, zone) {
    // --- intención de movimiento ---
    let f = 0, s = 0;
    if (Input.down('KeyW') || Input.down('ArrowUp')) f += 1;
    if (Input.down('KeyS') || Input.down('ArrowDown')) f -= 1;
    if (Input.down('KeyD') || Input.down('ArrowRight')) s += 1;
    if (Input.down('KeyA') || Input.down('ArrowLeft')) s -= 1;
    const running = (Input.down('ShiftLeft') || Input.down('ShiftRight')) && !this.crouch && f > 0;
    const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
    let wx = -sy * f + cy * s, wz = -cy * f - sy * s; const wl = Math.hypot(wx, wz); if (wl > 0) { wx /= wl; wz /= wl; }
    let speed = this.crouch ? CONFIG.CROUCH_SPEED : running ? CONFIG.RUN_SPEED : CONFIG.WALK_SPEED;
    if (this.stair) speed *= CONFIG.STAIR_SPEED;
    const a = 1 - Math.exp(-(wl > 0 ? 9 : 11) * dt);
    this.vel.x += (wx * speed - this.vel.x) * a; this.vel.z += (wz * speed - this.vel.z) * a;
    // --- mover con deslizamiento contra paredes ---
    const dx = this.vel.x * dt, dz = this.vel.z * dt, refY = this.pos.y;
    let g = this.canStand(zone, this.pos.x + dx, this.pos.z + dz, refY), moved = 0;
    if (g) { this.pos.x += dx; this.pos.z += dz; moved = Math.hypot(dx, dz); }
    else if ((g = this.canStand(zone, this.pos.x + dx, this.pos.z, refY))) { this.pos.x += dx; moved = Math.abs(dx); this.vel.z *= 0.5; }
    else if ((g = this.canStand(zone, this.pos.x, this.pos.z + dz, refY))) { this.pos.z += dz; moved = Math.abs(dz); this.vel.x *= 0.5; }
    else { this.vel.x *= 0.2; this.vel.z *= 0.2; g = zone.groundAt(this.pos.x, this.pos.z, refY); }
    if (g) { this.pos.y = g.y; this.surface = g.surface; this.stair = g.stair; }
    // --- altura de cámara (suave en escaleras y al agacharse) ---
    const eyeT = this.crouch ? CONFIG.CROUCH_EYE : CONFIG.EYE_HEIGHT;
    this.eye += (eyeT - this.eye) * (1 - Math.exp(-8 * dt));
    this.camY += (this.pos.y + this.eye - this.camY) * (1 - Math.exp(-14 * dt));
    // --- pisadas ---
    const sp = Math.hypot(this.vel.x, this.vel.z);
    this.moving = sp > 0.25;
    let stepLen = this.crouch ? CONFIG.STEP_CROUCH : running ? CONFIG.STEP_RUN : CONFIG.STEP_WALK;
    if (this.stair) stepLen = this.stair.tread * (running ? 2 : 1) * 1.02;
    if (this.moving) {
      this.stepAcc += moved;
      if (this.stepAcc >= stepLen) {
        this.stepAcc -= stepLen; this.stepCount++;
        const dy = this.pos.y - this.lastY; this.lastY = this.pos.y;
        AudioSys.footstep(this.surface, { run: running, crouch: this.crouch, stairs: this.stair ? (dy < -0.02 ? 'down' : 'up') : null });
      }
    } else if (this.stepAcc > stepLen * 0.45 && sp < 0.08) { // paso final al detenerse
      this.stepAcc = 0; this.stepCount++; AudioSys.footstep(this.surface, { crouch: this.crouch, run: false });
    }
    const target = this.moving ? Math.min(1, sp / CONFIG.WALK_SPEED) * (running ? 1.6 : 1) : 0;
    this.bobAmp += (target - this.bobAmp) * (1 - Math.exp(-6 * dt));
  },
  applyCamera(cam, time) {
    const ph = this.stepAcc / (this.stair ? this.stair.tread : (this.crouch ? CONFIG.STEP_CROUCH : CONFIG.STEP_WALK));
    let bx = 0, by = 0, roll = 0;
    if (S.headBob) {
      const A = CONFIG.HEADBOB * this.bobAmp;
      by = -A * (0.5 + 0.5 * Math.cos(clamp(ph, 0, 1) * PI * 2));
      const side = this.stepCount % 2 ? 1 : -1;
      bx = A * 0.6 * side * Math.sin(clamp(ph, 0, 1) * PI); roll = A * 0.25 * side * Math.sin(clamp(ph, 0, 1) * PI);
    }
    const breathe = Math.sin(time * 1.6) * 0.004;
    const rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);
    cam.position.set(this.pos.x + rx * bx, this.camY + by + breathe, this.pos.z + rz * bx);
    cam.rotation.set(this.pitch + Math.sin(time * 0.8) * 0.002, this.yaw, roll);
  },
};

/* =====================================================================
   LINTERNA — SpotLight con retraso al seguir la cámara y leve parpadeo
   ===================================================================== */
const Flashlight = {
  on: false, dir: new THREE.Vector3(0, 0, -1), level: 0, flick: 1, flickT: 0,
  toggle() { this.on = !this.on; AudioSys.flashClick(this.on); },
  update(dt, cam, time) {
    const fwd = _v.set(0, 0, -1).applyQuaternion(cam.quaternion);
    this.dir.lerp(fwd, 1 - Math.exp(-CONFIG.FLASH_LAG * dt)).normalize();
    this.level += ((this.on ? 1 : 0) - this.level) * (1 - Math.exp(-25 * dt));
    this.flickT -= dt;
    if (this.flickT <= 0) { this.flickT = rand(0.05, 0.12); this.flick = Math.random() < 0.025 ? rand(0.35, 0.7) : rand(0.96, 1.0); }
    const L = World.flash;
    const off = new THREE.Vector3(0.16, -0.22, 0).applyQuaternion(cam.quaternion);
    L.position.copy(cam.position).add(off);
    World.flashTarget.position.copy(L.position).add(this.dir);
    L.intensity = CONFIG.FLASH_INTENSITY * this.level * this.flick * (0.97 + Math.sin(time * 31) * 0.015);
  },
};

// Bicicleta "mamachari" abandonada (cilindros + toros fusionados)
function bicycle(B, x, z, rot) {
  const m = new THREE.Matrix4().makeRotationY(rot).setPosition(x, 0, z);
  const T = (p) => new THREE.Vector3(p[0], p[1], p[2]).applyMatrix4(m).toArray();
  const k = 'dark';
  for (const wx of [-0.52, 0.52]) B.bt(k).geo(new THREE.TorusGeometry(0.31, 0.022, 5, 22), m.clone().multiply(new THREE.Matrix4().setPosition(wx, 0.33, 0)));
  const tubes = [[[-0.52, 0.33, 0], [-0.05, 0.3, 0]], [[-0.52, 0.33, 0], [-0.18, 0.84, 0]], [[-0.05, 0.3, 0], [-0.18, 0.84, 0]],
    [[-0.05, 0.3, 0], [0.4, 0.72, 0]], [[0.4, 0.72, 0], [0.37, 0.98, 0]], [[0.4, 0.72, 0], [0.52, 0.33, 0]], [[-0.18, 0.84, 0], [0.38, 0.8, 0]],
    [[0.36, 0.99, -0.26], [0.36, 0.99, 0.26]], [[-0.18, 0.84, 0], [-0.2, 0.92, 0]]];
  for (const [a, b] of tubes) B.cyl('grey', T(a), T(b), 0.016, 6);
  const s = T([-0.21, 0.94, 0]); B.box('black', s[0] - 0.12, s[1], s[2] - 0.08, s[0] + 0.12, s[1] + 0.05, s[2] + 0.08);
  const bk = T([0.62, 0.86, 0]); B.box('grey', bk[0] - 0.17, bk[1] - 0.1, bk[2] - 0.16, bk[0] + 0.17, bk[1] + 0.12, bk[2] + 0.16, { skip: ['py'] });
  const c = T([0, 0, 0]); B.collider(c[0] - 0.8, c[0] + 0.8, c[2] - 0.8, c[2] + 0.8, 0, 1.2);
}
// Vallas de obra rayadas en línea a lo largo de z (cierran la calle)
function barrierZ(B, x, z0, z1, y = 0) {
  for (let z = z0; z < z1 - 0.1; z += 1.7) {
    const za = z, zb = Math.min(z + 1.6, z1);
    B.box('stripes', x - 0.04, y + 0.55, za, x + 0.04, y + 0.85, zb);
    B.box('stripes', x - 0.04, y + 0.15, za, x + 0.04, y + 0.3, zb);
    for (const zz of [za + 0.1, zb - 0.1]) B.box('grey', x - 0.25, y, zz - 0.04, x + 0.25, y + 0.95, zz + 0.04);
  }
}

function buildZone1() {

  const OX0 = -2.2, OX1 = 1.6, CY = 2.7;      // hueco de la entrada y altura de la marquesina

  for (let x = XL; x < XR; x += 4) if (x + 2 < -5 || x > 0.6) B.floor('roadPaint', x, x + 2, 7.42, 7.58, -0.114, { seg: 2 });

  // charcos (llovió hace poco)

    B.surface(x - rx * 0.8, x + rx * 0.8, z - rz * 0.8, z + rz * 0.8, y, 'puddle', 3);

  // marquesina luminosa

  B.ceil('ceilPanel', FX0 - 0.05, FX1 + 0.05, -3.0, -2.28, CY);

  const rg = B.glow([AX0 + 0.25, TY + 2.53, 2.2], [0.6, 0.03, 0.01], 1.6);
  B.realDefs[2] = { p: [AX0 + 0.4, TY + 2.5, 2.2], color: lin(0xff2a14), I: 2.6, range: 8, group: 'red',
    bake: { p: [AX0 + 0.4, TY + 2.5, 2.2], color: lin(0xff2a14), I: 2.6, range: 8, dir: [1, 0, 0], dmin: 0.3 } };
  { const g = B.grp('red', 'none'); g.real = 2; g.glows.push(rg); }
  B.glint({ L: [AX0 + 0.3, TY + 2.5, 2.2], fy: TY + 0.03, color: lin(0xff2a14), k: 0.5, size: 0.6, len: 1.4, b: [AX0, AX0 + 14, 1, 4] });
  B.occluder(4.5, 12, CH, 7.1, -1.7, -1.6);
  // ---------- Sonido ----------
  B.emitter({ type: 'hum', pos: [2, 2.65, LZ0 + 0.2], gain: 0.05, group: 'n0', sizzle: 2.4 });
  B.emitter({ type: 'hum', pos: [18, 2.65, LZ0 + 0.2], gain: 0.05, group: 'n1', sizzle: 3.2 });
  B.emitter({ type: 'fan', pos: [AX0 - 1, 2.0, 2.2], gain: 0.12, ref: 3 });
  B.emitter({ type: 'drip', pos: [-20, AYB + AR - 0.1, 2.5], gain: 0.26, send: 1.0, min: 2.5, max: 7 });
  B.emitter({ type: 'drip', pos: [-44, AYB + AR - 0.1, 3.8], gain: 0.22, send: 1.0, min: 4, max: 10 });
  B.emitter({ type: 'drip', pos: [6, CH - 0.1, 4.2], gain: 0.22, send: 1.0, min: 3, max: 9 });
  B.emitter({ type: 'creak', pos: [-30, 2.2, 2.2], gain: 0.3, ref: 3 });
  B.emitter({ type: 'wind', pos: [AX0 + 4, 0.8, 2.2], gain: 0.05, ref: 3 });
  B.emitter({ type: 'rumble', gain: 0.34, first: 9 });
  B.emitter({ type: 'roomtone', gain: 0.07, f: 110 });
  B.spawn('fromZ4', 11.2, -2.3, PI / 2);
  B.spawn('fromZ2', 15.95, -2.1, PI);
  B.spawn('fromZ6', AX0 + 1.5, 2.2, -PI / 2);
  return B;
}

/* =====================================================================
   GESTOR DE ZONAS — solo la zona actual y las adyacentes viven en memoria
   ===================================================================== */
// Grafo del recorrido (semilineal, con atajos que se abren desde el otro lado)
const ZONE_DEFS = {
  z1: { build: buildZone1, adj: ['z2'] },
  z2: { build: buildZone2, adj: ['z1', 'z3', 'z5'] },
  z3: { build: buildZone3, adj: ['z2', 'z4'] },
  z4: { build: buildZone4, adj: ['z3', 'z5'] },
  z5: { build: buildZone5, adj: ['z4', 'z2'] },
};
const Zones = {
  cache: new Map(), current: null,
  get(id) {
    if (!this.cache.has(id)) {
      const t0 = performance.now();
      const ctx = ZONE_DEFS[id].build(), t1 = performance.now();
      const z = ctx.finalize();
      this.cache.set(id, z);
      if (DEBUG) console.log(`[zona] ${id} construida en ${(performance.now() - t0).toFixed(0)} ms (geometría+texturas ${(t1 - t0).toFixed(0)} ms, horneado ${(performance.now() - t1).toFixed(0)} ms)`);
    }
    return this.cache.get(id);
  },
  activate(id, spawnName) {
    if (this.current && this.current.id !== id) this.current.deactivate();
    const z = this.get(id);
    if (this.current !== z || !z.active) z.activate();
    this.current = z;
    if (spawnName && z.spawns[spawnName]) Player.place(z.spawns[spawnName], z);
    this.prune();
    return z;
  },
  // Construye las zonas vecinas y precompila sus shaders. Se llama con la pantalla
  // en negro (carga inicial y fundidos) para que nunca haya tirones al caminar.
  prebuild() {
    if (!this.current) return;
    for (const id of ZONE_DEFS[this.current.id].adj) {
      if (!ZONE_DEFS[id] || this.cache.has(id)) continue;
      const z = this.get(id);
      try { World.renderer.compile(z.group, World.camera, World.scene); } catch (e) { /* opcional */ }
    }
  },
  // Libera (dispose) las zonas que no son la actual ni adyacentes
  prune() {
    const keep = new Set([this.current.id, ...ZONE_DEFS[this.current.id].adj]);
    let freed = false;
    for (const [id, z] of this.cache) if (!keep.has(id)) { if (z.active) z.deactivate(); z.dispose(); this.cache.delete(id); freed = true; if (DEBUG) console.log('[zona] liberada', id); }
    if (freed) gcShared();
  },
  // Reconstruye todo (cambio de calidad: cambia qué luces son reales y cuáles horneadas)
  rebuild() {
    if (!this.current) return;
    const id = this.current.id; this.current.deactivate();
    for (const z of this.cache.values()) z.dispose();
    this.cache.clear(); this.current = null;
    this.activate(id, null);
  },
};

// Libera materiales y texturas compartidos que ya no usa ninguna zona en memoria
function gcShared() {
  const used = new Set(); for (const z of Zones.cache.values()) for (const k of z.matKeys) used.add(k);
  for (const k of Object.keys(MATS)) if (!used.has(k)) { MATS[k].dispose(); delete MATS[k]; }
  const live = new Set(); for (const m of Object.values(MATS)) { if (m.map) live.add(m.map); if (m.bumpMap) live.add(m.bumpMap); }
  for (const [k, t] of Object.entries(TEX)) if (k !== 'streak' && !live.has(t)) { t.dispose(); delete TEX[k]; }
}

/* =====================================================================
   JUEGO — estados, fundidos, interacción, menús
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const Game = {
  state: 'loading', fade: 1, fadeTarget: 1, fadeSpeed: 1, fadeDone: null, busy: false, armed: true, target: null, time: 0, optionsFrom: 'menu', started: false,
  fadeTo(v, dur = CONFIG.FADE_TIME) {
    this.fadeTarget = v; this.fadeSpeed = 1 / Math.max(0.01, dur);
    return new Promise((res) => { if (this.fade === v) res(); else this.fadeDone = res; });
  },
  show(id) { for (const s of ['menu', 'pause', 'options', 'loading']) $(s).classList.toggle('hidden', s !== id); },
  async start() {
    if (this.busy) return; this.busy = true;
    AudioSys.init(); applyAudioQuality();
    this.show(null);
    await this.fadeTo(1, 0.6);
    const z = Zones.activate('z1', 'start'); z.startAudio();
    AudioSys.resetReverb(); z.updateReverb(true);
    Flashlight.on = false; Player.crouch = false; Player.eye = CONFIG.EYE_HEIGHT;
    this.state = 'playing'; this.started = true; this.armed = false;
    Input.requestLock();
    AudioSys.setWorld(1, 0.8);
    await this.fadeTo(0, 1.6);
    this.busy = false;
  },
  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused'; Input.keys.clear(); this.show('pause'); $('resume').classList.add('hidden');
    AudioSys.setWorld(0.25, 0.25); $('dot').classList.remove('on');
  },
  resume() {
    this.state = 'playing'; this.show(null); AudioSys.setWorld(1, 0.3); Input.requestLock();
  },
  async quit() {
    if (this.busy) return; this.busy = true; this.show(null);
    AudioSys.setWorld(0, 0.3);
    await this.fadeTo(1, 0.6);
    if (document.pointerLockElement) document.exitPointerLock();
    this.state = 'menu';
    const z = Zones.activate('z1', null); z.stopAudio();
    Flashlight.on = false;
    this.show('menu');
    await this.fadeTo(0, 1.2);
    this.busy = false;
  },
  openOptions(from) { this.optionsFrom = from; syncOptionsUI(); this.show('options'); },
  closeOptions() { this.show(this.optionsFrom); },
  // Cambio de zona con fundido a negro
  async transition(to, spawn, wait = 0) {
    if (this.busy) return; this.busy = true;
    if (wait) await new Promise((r) => setTimeout(r, wait * 1000));
    AudioSys.setWorld(0, 0.25);
    await this.fadeTo(1, CONFIG.FADE_TIME);
    const z = Zones.activate(to, spawn);
    Zones.prebuild();
    AudioSys.resetReverb(); z.updateReverb(true);
    this.armed = false;
    Post.render(this.time, 1);                 // calienta shaders/texturas con la pantalla en negro
    await nextFrame();
    AudioSys.setWorld(1, 0.6);
    await this.fadeTo(0, CONFIG.FADE_TIME * 1.3);
    this.busy = false;
  },
  checkPortals() {
    const z = Zones.current, p = Player.pos; let inside = null;
    for (const pt of z.portals) { const b = pt.box; if (!condOk(pt.cond)) continue; if (p.x >= b.x0 && p.x <= b.x1 && p.z >= b.z0 && p.z <= b.z1 && p.y >= b.y0 && p.y <= b.y1) { inside = pt; break; } }
    if (!inside) { this.armed = true; return; }
    if (this.armed && ZONE_DEFS[inside.to]) { this.armed = false; this.transition(inside.to, inside.spawn); }
  },
  checkInteract(cam) {
    const z = Zones.current, o = cam.position, d = _v.set(0, 0, -1).applyQuaternion(cam.quaternion);
    let best = null, bd = CONFIG.INTERACT_DIST;
    for (const it of z.inter) { if (!condOk(it.cond)) continue; const t = rayBox(o, d, it.box); if (t !== null && t < bd) { bd = t; best = it; } }
    this.target = best; $('dot').classList.toggle('on', !!best);
  },
  interact() { if (this.target && !this.busy) this.target.action(); },
};
function rayBox(o, d, b) {
  let t0 = 0, t1 = Infinity;
  for (const [oa, da, mn, mx] of [[o.x, d.x, b.x0, b.x1], [o.y, d.y, b.y0, b.y1], [o.z, d.z, b.z0, b.z1]]) {
    if (Math.abs(da) < 1e-9) { if (oa < mn || oa > mx) return null; continue; }
    let ta = (mn - oa) / da, tb = (mx - oa) / da; if (ta > tb) { const s = ta; ta = tb; tb = s; }
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) return null;
  }
  return t0;
}

/* ---------- Opciones (UI) ---------- */
function syncOptionsUI() {
  document.querySelectorAll('[data-set]').forEach((el) => {
    const k = el.dataset.set;
    if (el.classList.contains('seg')) el.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === S[k]));
    else if (el.type === 'checkbox') el.checked = !!S[k];
    else { el.value = S[k]; const out = el.parentElement.querySelector('output'); if (out) out.textContent = (+S[k]).toFixed(2); }
  });
}
function bindUI() {
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation(); const a = b.dataset.act;
    if (a === 'start') Game.start();
    else if (a === 'options') Game.openOptions(Game.state === 'paused' ? 'pause' : 'menu');
    else if (a === 'back') Game.closeOptions();
    else if (a === 'resume') Game.resume();
    else if (a === 'quit') Game.quit();
  }));
  document.querySelectorAll('[data-set]').forEach((el) => {
    const k = el.dataset.set;
    if (el.classList.contains('seg')) el.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { S[k] = b.dataset.v; onSetting(k); syncOptionsUI(); }));
    else if (el.type === 'checkbox') el.addEventListener('change', () => { S[k] = el.checked; onSetting(k); });
    else el.addEventListener('input', () => { S[k] = parseFloat(el.value); const out = el.parentElement.querySelector('output'); if (out) out.textContent = S[k].toFixed(2); onSetting(k); });
  });
  $('resume').addEventListener('click', () => { if (Game.state === 'paused') Game.resume(); else Input.requestLock(); });
}
function onSetting(k) {
  saveSettings();
  if (['master', 'ambient', 'musicOn', 'music'].includes(k)) AudioSys.applyVolumes();
  if (k === 'quality') applyQuality(true);
}
function applyAudioQuality() { /* HRTF/IR dependen de Q y se aplican al crear emisores/impulsos */ }
function applyQuality(rebuild) {
  const prev = Q; Q = QUALITY[S.quality] || QUALITY.medium;
  World.camera.far = Q.far; World.camera.updateProjectionMatrix();
  World.lights.forEach((L, i) => { L.visible = i < Q.realLights; });
  Post.resize();
  if (rebuild && prev !== Q && Zones.current) {
    const wasAudio = Zones.current.emitters.length > 0;
    Zones.rebuild(); Zones.prebuild();
    if (!wasAudio) Zones.current.stopAudio();
    AudioSys.resetReverb(); Zones.current.updateReverb(true);
  }
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
const clock = new THREE.Clock();
let fpsT = performance.now(), fpsN = 0;
function menuCamera(t) {
  const cam = World.camera, mc = Zones.current && Zones.current.menuCamSpec;
  const p = mc ? mc.p : [4.3, 1.5, 2.3], tg = mc ? mc.t : [-1, 1.25, -4.4];
  cam.position.set(p[0] + Math.sin(t * 0.05) * 0.5, p[1] + Math.sin(t * 0.11) * 0.03, p[2] + Math.sin(t * 0.037) * 0.25);
  cam.lookAt(tg[0] + Math.sin(t * 0.03) * 0.6, tg[1], tg[2]);
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.066); Game.time += dt;
  World.renderer.info.reset();
  const cam = World.camera, z = Zones.current;
  // fundido
  if (Game.fade !== Game.fadeTarget) {
    const s = dt * Game.fadeSpeed;
    Game.fade = Game.fadeTarget > Game.fade ? Math.min(Game.fadeTarget, Game.fade + s) : Math.max(Game.fadeTarget, Game.fade - s);
    if (Game.fade === Game.fadeTarget && Game.fadeDone) { const r = Game.fadeDone; Game.fadeDone = null; r(); }
  }
  if (z) {
    if (Game.state === 'playing') {
      if (!Game.busy) Player.update(dt, z);
      Player.applyCamera(cam, Game.time);
      if (!Game.busy) { Game.checkPortals(); Game.checkInteract(cam); }
    } else if (Game.state === 'menu' || Game.state === 'loading') menuCamera(Game.time);
    else if (Game.state === 'paused') Player.applyCamera(cam, Game.time);
    cam.updateMatrixWorld();
    Flashlight.update(dt, cam, Game.time);
    z.update(dt, Game.time, cam);
    AudioSys.updateListener(cam);
  }
  Post.render(Game.time, Game.fade);
  if (DEBUG) {
    fpsN++; const now = performance.now();
    if (now - fpsT > 500) {
      const info = World.renderer.info.render;
      $('fps').textContent = `${(fpsN * 1000 / (now - fpsT)).toFixed(0)} fps  calls ${info.calls}  tris ${info.triangles}\n${z ? z.id : ''} ${Player.surface} ${Player.pos.x.toFixed(1)},${Player.pos.y.toFixed(2)},${Player.pos.z.toFixed(1)}`;
      fpsT = now; fpsN = 0;
    }
  }
}
addEventListener('resize', () => {
  World.renderer.setSize(innerWidth, innerHeight);
  World.camera.aspect = innerWidth / innerHeight; World.camera.updateProjectionMatrix();
  Post.resize();
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot() {
  loadSettings(); Q = QUALITY[S.quality];
  initWorld(); Post.init(); applyQuality(false); initInput(); bindUI(); syncOptionsUI();
  if (DEBUG) $('fps').classList.remove('hidden');
  await nextFrame(); await nextFrame();
  const z = Zones.activate('z1', 'start');
  Zones.prebuild();
  Game.state = 'menu';
  requestAnimationFrame(frame);
  await nextFrame();
  window.__booted = true;
  Game.show('menu');
  Game.fadeTo(0, 2.0);
  if (DEBUG) window.__game = { TEXT, Tex, TEX, Game, Zones, Player, AudioSys, World, Flashlight, S, Q: () => Q, CONFIG,
    tp(id, spawn) { return Game.transition(id, spawn); },
    set(x, z, yaw = Player.yaw, pitch = 0) { const g = Zones.current.groundTop(x, z); Player.pos.set(x, g ? g.y : Player.pos.y, z); Player.camY = Player.pos.y + Player.eye; Player.yaw = yaw; Player.pitch = pitch; } };
  return z;
}
boot().catch((e) => {
  console.error(e);
  const f = $('fatal'); f.classList.remove('hidden'); f.textContent = 'Error al iniciar: ' + (e && e.message ? e.message : e);
});
</script>
