<!-- Three.js desde CDN con versión fijada. Necesita internet la primera vez que se abre. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script>
  // Aviso si Three.js no carga (sin conexión) o si hay un error antes de arrancar.
  window.addEventListener('error', function (e) {
    if (window.__booted) return;
    var f = document.getElementById('fatal');
    if (f) { f.classList.remove('hidden'); f.textContent = 'Error al iniciar: ' + (e.message || e); }
  });
  setTimeout(function () {
    if (window.__booted) return;
    var f = document.getElementById('fatal');
    if (f) { f.classList.remove('hidden');
      f.innerHTML = 'No se pudo cargar el motor 3D.<br>La primera vez necesitas conexión a internet (Three.js se descarga de cdn.jsdelivr.net). Usa Chrome, Edge o Firefox actualizados.'; }
  }, 20000);
</script>
